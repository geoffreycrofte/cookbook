# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Configuration de l'interface d'édition (Sveltia CMS), servie sur /admin/.
#
# Elle doit rester le miroir de src/content.config.ts. En cas de divergence,
# c'est le schéma Astro qui tranche : il fait échouer le build, là où le CMS
# se contenterait d'écrire un fichier invalide.

backend:
  name: github
  repo: geoffreycrofte/cookbook
  branch: main
  # Aucun `base_url` : la connexion se fait par jeton personnel, sans service
  # d'authentification tiers à déployer. Voir le README.

# Chemins de secours. La collection des recettes les redéfinit pour ranger
# chaque photo dans le dossier de sa recette.
media_folder: public/media
public_folder: /media

# La langue de l'interface suit celle du navigateur : rien à déclarer ici.

collections:
  - name: recettes
    label: Recettes
    label_singular: Recette
    description: >-
      Une recette par dossier, avec sa photo à côté. Les champs marqués comme
      facultatifs peuvent rester vides.
    folder: src/content/recettes
    # Une recette est un dossier : <slug>/index.md, la photo à côté.
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    identifier_field: titre
    slug: '{{titre}}'
    summary: '{{titre}}'
    sortable_fields: [miseAJour, titre, portions]
    view_groups:
      - label: Catégorie
        field: categorie
    fields:
      - { label: Titre, name: titre, widget: string }

      - label: Description
        name: description
        widget: text
        hint: Une phrase, 200 caractères au maximum. Elle s’affiche sous le titre et dans les résultats de recherche.

      - label: Photo du plat fini
        name: image
        widget: image
        hint: Elle est enregistrée dans le dossier de la recette et optimisée automatiquement au build.

      - label: Description de la photo
        name: imageAlt
        widget: string
        hint: Ce que montre la photo, pour les personnes qui ne la voient pas. Obligatoire.

      - label: Crédit photo
        name: credit
        widget: string
        required: false
        hint: À remplir uniquement si la photo n’est pas de vous.

      # — Temps et rendement —
      - { label: Préparation (minutes), name: preparation, widget: number, value_type: int, min: 0 }
      - { label: Cuisson (minutes), name: cuisson, widget: number, value_type: int, min: 0 }
      - label: Repos (minutes)
        name: repos
        widget: number
        value_type: int
        min: 0
        default: 0
        required: false
      - { label: Portions, name: portions, widget: number, value_type: int, min: 1, default: 4 }

      # — Cuisson à l'airfryer —
      - label: Cuisson à l’airfryer
        name: airfryer
        widget: boolean
        default: false
        hint: Si vous cochez, la température devient obligatoire.

      - label: Température (°C)
        name: temperature
        widget: number
        value_type: int
        min: 40
        max: 250
        required: false

      - { label: Préchauffage nécessaire, name: prechauffage, widget: boolean, required: false }

      - label: Secouer le panier à mi-cuisson
        name: secouerAMiCuisson
        widget: boolean
        default: false
        required: false
        hint: Réservé aux recettes à l’airfryer.

      # — Classement —
      - label: Catégorie
        name: categorie
        widget: select
        options:
          - { label: Entrée, value: entree }
          - { label: Plat, value: plat }
          - { label: Dessert, value: dessert }
          - { label: Snack, value: snack }
          - { label: Accompagnement, value: accompagnement }

      - label: Difficulté
        name: difficulte
        widget: select
        default: facile
        options:
          - { label: Facile, value: facile }
          - { label: Moyen, value: moyen }
          - { label: Technique, value: technique }

      - label: Saisons
        name: saison
        widget: select
        multiple: true
        required: false
        options:
          - { label: Printemps, value: printemps }
          - { label: Été, value: ete }
          - { label: Automne, value: automne }
          - { label: Hiver, value: hiver }

      - label: Régimes
        name: regime
        widget: select
        multiple: true
        required: false
        hint: Liste fermée. Pour en ajouter une valeur, il faut modifier src/content.config.ts.
        options:
          - { label: Végétarien, value: vegetarien }
          - { label: Végan, value: vegan }
          - { label: "Poisson, sans viande", value: pescatarien }
          - { label: Sans gluten, value: sans-gluten }
          - { label: Sans lactose, value: sans-lactose }
          - { label: Sans porc, value: sans-porc }
          - { label: Sans fruits à coque, value: sans-fruits-a-coque }

      - label: Étiquettes
        name: tags
        widget: list
        required: false
        hint: Texte libre, en minuscules. Elles alimentent les filtres de la page d’accueil.

      - label: Recette de la flemme
        name: flemme
        widget: boolean
        default: false
        hint: Elle entre alors dans le tirage au sort « J’ai la flemme ».

      # — Préparations —
      # Deux façons de décrire une recette, jamais les deux à la fois.
      # Le build refuse la contradiction avec un message explicite.
      - label: Ingrédients (recette simple)
        name: ingredients
        widget: list
        required: false
        collapsed: false
        label_singular: Ingrédient
        summary: '{{fields.quantite}} {{fields.unite}} {{fields.nom}}'
        hint: À laisser vide si la recette est découpée en parties, plus bas.
        fields:
          - { label: Quantité, name: quantite, widget: number, value_type: float, required: false }
          - label: Unité
            name: unite
            widget: string
            required: false
            hint: 'g, kg, ml, cuillère à soupe, pièce, pincée… au singulier : l’accord au pluriel est automatique.'
          - { label: Ingrédient, name: nom, widget: string }
          - label: Précision
            name: precision
            widget: string
            required: false
            hint: '« coupé en dés », « à température ambiante »…'
          - label: Se multiplie avec les portions
            name: ajustable
            widget: boolean
            default: true
            hint: À décocher pour le sel, la levure et tout ce qui ne double pas.
          - label: Optionnel
            name: optionnel
            widget: boolean
            default: false
            hint: Affiche un petit « optionnel » au-dessus de l’ingrédient.

      - label: Étapes (recette simple)
        name: etapes
        widget: list
        required: false
        label_singular: Étape
        summary: '{{fields.texte}}'
        hint: À laisser vide si la recette est découpée en parties, plus bas.
        fields:
          - { label: Étape, name: texte, widget: text }
          - label: Température (°C)
            name: temperature
            widget: number
            value_type: int
            min: 40
            max: 250
            required: false
          - { label: Durée (minutes), name: duree, widget: number, value_type: float, required: false }
          - label: Photo de l’étape
            name: image
            widget: image
            required: false
            hint: Facultative. Un geste, une texture, un résultat intermédiaire.
          - label: Description de la photo
            name: imageAlt
            widget: string
            required: false
            hint: Ce que montre la photo. Obligatoire dès qu’une photo est choisie.

      - label: Parties (recette en plusieurs préparations)
        name: parties
        widget: list
        required: false
        label_singular: Partie
        summary: '{{fields.nom}}'
        hint: >-
          Pour un plat qui demande plusieurs préparations distinctes : le plat,
          une sauce, un pain. Deux parties au minimum. Dans ce cas, laissez vides
          les champs « Ingrédients » et « Étapes » ci-dessus. Chaque partie est
          soit écrite ici (nom + ingrédients + étapes), soit une recette
          autonome réutilisée (champ « Recette incluse »), jamais les deux.
        fields:
          - label: Nom de la partie
            name: nom
            widget: string
            required: false
            hint: "Obligatoire pour une partie écrite. Facultatif pour une recette incluse (défaut : son titre)."
          - label: Recette incluse
            name: inclut
            widget: relation
            required: false
            collection: recettes
            search_fields: [titre]
            value_field: '{{slug}}'
            display_fields: [titre]
            hint: >-
              Réutilise une recette autonome (une sauce, une soupe, une viande)
              comme partie. Ses ingrédients et ses étapes sont repris et mis à
              l’échelle. Laisser vide pour écrire la partie à la main.
          - label: Portions visées (recette incluse)
            name: portions
            widget: number
            value_type: int
            required: false
            hint: "Défaut : les portions du plat. À renseigner si la recette incluse est écrite pour un autre nombre."
          - label: Note d’enchaînement
            name: note
            widget: string
            required: false
            hint: '« À préparer pendant que le curry mijote. »'
          - label: Ingrédients
            name: ingredients
            widget: list
            required: false
            label_singular: Ingrédient
            summary: '{{fields.quantite}} {{fields.unite}} {{fields.nom}}'
            fields:
              - { label: Quantité, name: quantite, widget: number, value_type: float, required: false }
              - { label: Unité, name: unite, widget: string, required: false }
              - { label: Ingrédient, name: nom, widget: string }
              - { label: Précision, name: precision, widget: string, required: false }
              - { label: Se multiplie avec les portions, name: ajustable, widget: boolean, default: true }
              - { label: Optionnel, name: optionnel, widget: boolean, default: false }
          - label: Étapes
            name: etapes
            widget: list
            required: false
            label_singular: Étape
            summary: '{{fields.texte}}'
            fields:
              - { label: Étape, name: texte, widget: text }
              - label: Température (°C)
                name: temperature
                widget: number
                value_type: int
                min: 40
                max: 250
                required: false
              - { label: Durée (minutes), name: duree, widget: number, value_type: float, required: false }
              - label: Photo de l’étape
                name: image
                widget: image
                required: false
                hint: Facultative. Un geste, une texture, un résultat intermédiaire.
              - label: Description de la photo
                name: imageAlt
                widget: string
                required: false
                hint: Ce que montre la photo. Obligatoire dès qu’une photo est choisie.

      # — Métadonnées —
      - label: Dernière mise à jour
        name: miseAJour
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        format: 'YYYY-MM-DD'

      - label: Brouillon
        name: brouillon
        widget: boolean
        default: false
        hint: Coché, la recette reste hors du site publié.

      - label: Recette interne
        name: interne
        widget: boolean
        default: false
        hint: >-
          Coché, la recette garde sa page (utilisable via « Recette incluse »)
          mais disparaît de l’accueil, de la recherche, du sitemap et du flux
          RSS. À réserver aux composants (une farce, une sauce…) qui n’ont pas
          d’intérêt à être faits seuls. Liste : /recettes-internes/.

      - label: Nos notes
        name: body
        widget: markdown
        required: false
        hint: >-
          Introduction, astuces et variantes. Les espaces insécables avant les
          deux-points et les points d’interrogation sont ajoutés automatiquement.

  - name: materiel
    label: Matériel de cuisine
    label_singular: Élément
    description: >-
      Le matériel de cuisson, les ustensiles et les ingrédients difficiles à
      trouver, affichés sur la page /materiel/. Un élément par dossier, avec sa
      photo carrée à côté.
    folder: src/content/materiel
    # Un élément est un dossier : <slug>/index.md, la photo à côté.
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    identifier_field: nom
    slug: '{{nom}}'
    summary: '{{nom}}'
    sortable_fields: [ordre, nom, miseAJour]
    view_groups:
      - label: Rubrique
        field: rubrique
    fields:
      - label: Nom
        name: nom
        widget: string
        hint: >-
          Il donne aussi l’adresse de l’élément. « Airfryer » devient
          /materiel/#airfryer, l’ancre vers laquelle une recette peut renvoyer.
          Renommer un élément déjà en ligne casse ces liens.

      - label: Description
        name: description
        widget: text
        hint: Quelques phrases, 400 caractères au maximum. À quoi ça sert, et pourquoi celui-là.

      - label: Photo
        name: image
        widget: image
        hint: Carrée. Elle est enregistrée dans le dossier de l’élément et optimisée automatiquement au build.

      - label: Description de la photo
        name: imageAlt
        widget: string
        hint: Ce que montre la photo, pour les personnes qui ne la voient pas. Obligatoire.

      - label: Rubrique
        name: rubrique
        widget: select
        options:
          - { label: Matériel de cuisson, value: cuisson }
          - { label: Ustensiles, value: ustensile }
          - { label: Ingrédients difficiles à trouver, value: ingredient }

      # — Lien vers le produit —
      - label: Lien
        name: lien
        widget: string
        required: false
        pattern: ['^https://', 'Le lien doit commencer par https://']
        hint: Facultatif. L’adresse complète de la page produit.

      - label: Marchand
        name: lienMarchand
        widget: string
        required: false
        hint: 'Affiché dans le bouton : « Voir sur Amazon ». À ne remplir que s’il y a un lien.'

      - label: Lien affilié
        name: lienAffilie
        widget: boolean
        default: false
        required: false
        hint: Coché, la page signale le lien comme affilié et affiche la mention de transparence.

      - label: Ordre d’affichage
        name: ordre
        widget: number
        value_type: int
        default: 100
        hint: Du plus petit au plus grand, à l’intérieur de la rubrique. À égalité, l’ordre alphabétique tranche.

      - label: Dernière mise à jour
        name: miseAJour
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        format: 'YYYY-MM-DD'

      - label: Brouillon
        name: brouillon
        widget: boolean
        default: false
        hint: Coché, l’élément reste hors du site publié.

      - label: Nos notes
        name: body
        widget: markdown
        required: false
        hint: Facultatif. Un complément affiché sous la description.
